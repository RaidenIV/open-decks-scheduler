<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Set Time Generator</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

<style>
/* ======= DESIGN.MD — BITSTREAM LOGIC TOKENS ======= */
:root {
    --accent:         #acc7ff;
    --accent2:        #498fff;
    --success:        #228B22;
    --danger:         #c0392b;
    --top-ui-height:  48px;
    --col-card-height:700px;
    --shadow:         0 4px 14px rgba(0,0,0,0.55);

    --bg:             #10131a;
    --panel:          #1d2027;
    --panel-2:        #272a31;
    --text:           #e0e2ec;
    --muted:          #c1c6d6;
    --border:         #414754;
    --border-2:       #414754;
    --line:           #414754;
    --input-bg:       #181c23;
    --input-text:     #e0e2ec;
    --chip:           rgba(255,255,255,0.08);
    --chip-text:      #c1c6d6;

    --radius-sm:  0.125rem;
    --radius:     0.25rem;
    --radius-md:  0.375rem;
    --radius-lg:  0.5rem;
}

/* ======= BASE ======= */
*, *::before, *::after { box-sizing: border-box; }

html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    margin: 0;
    min-height: 100vh;
    overflow-x: hidden;
    overflow-y: auto;
}

body {
    padding: 80px 24px 40px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
}

/* Cursor discipline */
body, .panel, .panel * { cursor: default; user-select: none; }
input[type="text"], input[type="time"], input[type="number"], textarea { cursor: text; user-select: text; }
select, button, .nav-menu a { cursor: pointer; }

/* ======= HAMBURGER NAV (DESIGN.md spec) ======= */
.nav-dropdown {
    position: fixed;
    top: 18px;
    left: 18px;
    z-index: 10000;
}

.nav-toggle {
    background: rgba(29, 32, 39, 0.92);
    border: 1px solid var(--border);
    border-radius: 6px;
    width: var(--top-ui-height);
    height: var(--top-ui-height);
    padding: 0;
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.2s ease, background 0.2s ease;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
}

.nav-toggle:hover {
    background: rgba(39, 42, 49, 0.95);
    border-color: var(--accent);
}

.nav-toggle .hamburger {
    display: flex;
    flex-direction: column;
    gap: 5px;
    pointer-events: none;
}

.nav-toggle .hamburger span {
    display: block;
    width: 20px;
    height: 2px;
    background: var(--text);
    border-radius: 2px;
    transition: transform 0.25s ease, opacity 0.2s ease, background 0.2s;
    transform-origin: center;
}

.nav-toggle:hover .hamburger span { background: var(--accent); }

/* Animate to X when nav is open */
.nav-dropdown.active .nav-toggle .hamburger span:nth-child(1) {
    transform: translateY(7px) rotate(45deg);
}
.nav-dropdown.active .nav-toggle .hamburger span:nth-child(2) {
    opacity: 0;
    transform: scaleX(0);
}
.nav-dropdown.active .nav-toggle .hamburger span:nth-child(3) {
    transform: translateY(-7px) rotate(-45deg);
}

.nav-menu {
    position: absolute;
    top: 56px;
    left: 0;
    background: rgba(29, 32, 39, 0.97);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
    min-width: 180px;
    opacity: 0;
    visibility: hidden;
    transform: translateY(-8px);
    transition: all 0.2s ease;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    overflow: hidden;
}

.nav-dropdown.active .nav-menu {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
}

.nav-menu a,
.nav-menu button.nav-item-btn {
    display: block;
    text-align: left;
    padding: 10px 16px;
    color: var(--muted);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    border-radius: 4px;
    transition: background 0.15s ease, color 0.15s ease;
    background: transparent;
    border: none;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    box-sizing: border-box;
}

.nav-menu a:hover,
.nav-menu button.nav-item-btn:hover {
    background: rgba(172, 199, 255, 0.08);
    color: var(--accent);
}

/* ======= OUTER PANEL ======= */
.panel {
    background: var(--panel);
    padding: 24px;
    border-radius: 8px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    width: 100%;
    max-width: 1400px;
}

/* ======= PANEL HEADER ======= */
.panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 20px;
}

.panel-titlewrap {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
}

h1 {
    text-align: left;
    margin: 0;
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.01em;
}

.panel-subtitle {
    font-size: 13px;
    font-weight: 400;
    color: var(--muted);
    line-height: 1.4;
}

.panel-logo {
    height: 36px;
    width: auto;
    max-width: 40%;
    object-fit: contain;
    flex: 0 0 auto;
    display: block;
    pointer-events: none;
    user-select: none;
}

/* ======= 3-COLUMN GRID ======= */
.panel-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 16px;
    align-items: stretch;
}

.panel-grid .col {
    min-width: 0;
    display: flex;
}

.panel-grid h2 { margin-top: 0; }

@media (max-width: 1100px) {
    .panel-grid { grid-template-columns: 1fr; }
    .col-card { height: auto; }
    #djNamesContainer.dj-list,
    #results,
    .preview-box { overflow: visible; }
}

@media (max-width: 768px) {
    body { padding: 80px 16px 32px; }
}

/* ======= COLUMN CARDS ======= */
h2 {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    margin: 0 0 14px 0;
    letter-spacing: -0.01em;
}

.col-card {
    flex: 1;
    background: var(--panel-2);
    border: 1px solid var(--border-2);
    border-radius: 8px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    height: var(--col-card-height);
    min-width: 0;
    min-height: 0;
}

.col-card h2 { margin-top: 0; }
.col-card .preview-label { margin-top: 0; }

/* ======= LABELS ======= */
label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin-top: 12px;
    margin-bottom: 5px;
}

/* ======= INPUTS ======= */
input[type="text"],
input[type="time"],
input[type="number"],
select {
    padding: 9px 11px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
    font-weight: 500;
    width: 100%;
    background: var(--input-bg);
    color: var(--input-text);
    font-family: 'Inter', sans-serif;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
}

input[type="text"]::placeholder,
input[type="number"]::placeholder {
    color: rgba(193,198,214,0.4);
    font-weight: 400;
}

input[type="text"]:focus,
input[type="time"]:focus,
input[type="number"]:focus,
select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(172,199,255,0.18);
}

/* Time input — white clock icon in dark mode */
input[type="time"] {
    color-scheme: dark;
    padding-right: 38px;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%23c1c6d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>');
    background-repeat: no-repeat;
    background-position: right 10px center;
    background-size: 16px 16px;
}

input[type="time"]::-webkit-calendar-picker-indicator {
    opacity: 0;
    display: block;
}

/* Preset select */
#presetSelect {
    -webkit-appearance: none;
    -moz-appearance: none;
    appearance: none;
    padding-right: 30px;
    background-image: url('data:image/svg+xml;utf8,<svg fill="%23c1c6d6" height="20" width="20" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><polygon points="5,7 15,7 10,12" /></svg>');
    background-repeat: no-repeat;
    background-position: right 10px center;
    background-color: var(--input-bg);
    color: var(--input-text);
    border-color: var(--border);
}

#presetSelect option {
    background-color: #181c23;
    color: var(--input-text);
}

.time-small { width: 160px !important; }

/* ======= ROW ======= */
.row {
    display: flex;
    gap: 10px;
    margin-top: 10px;
}

/* ======= DJ LIST ======= */
.dj-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 10px;
}

#djNamesContainer.dj-list {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding-right: 4px;
}

.dj-item {
    display: flex;
    align-items: center;
    padding: 8px 10px;
    background: var(--panel);
    border-radius: 6px;
    border: 1px solid var(--border);
    gap: 10px;
}

.drag-handle {
    padding: 4px 8px;
    background: var(--chip);
    border-radius: 4px;
    cursor: grab;
    font-weight: 700;
    font-size: 13px;
    color: var(--chip-text);
    user-select: none;
    flex-shrink: 0;
}

.dj-item input.name {
    flex: 1;
    border: none;
    background: transparent;
    font-size: 14px;
    font-weight: 600;
    padding: 4px 0;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-width: 0;
}

.dj-item input.name:focus {
    outline: none;
    box-shadow: none;
}

/* ======= RESULTS ======= */
#results {
    flex: 1;
    min-height: 0;
    overflow: auto;
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 10px;
    border-radius: 6px;
    margin-top: 4px;
}

.result-row {
    display: flex;
    flex-direction: column;
    background: transparent;
    border: none;
    padding: 8px 0;
    border-bottom: 1px solid var(--border-2);
    margin-bottom: 0;
    gap: 5px;
}

.result-row:last-child { border-bottom: none; }

.result-row input.inline {
    width: 120px;
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--input-bg);
    color: var(--input-text);
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 13px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
}

.result-row input.inline:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(172,199,255,0.18);
}

/* ======= PREVIEW ======= */
.preview-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin-bottom: 6px;
}

.preview-box {
    flex: 1;
    overflow: auto;
    min-height: 0;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
    font-size: 14px;
    font-weight: 500;
    font-family: 'Inter', monospace;
    white-space: pre-line;
    color: var(--text);
    line-height: 1.6;
}

/* ======= BUTTONS ======= */
button {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 13px;
    border-radius: 6px;
    padding: 9px 16px;
    cursor: pointer;
    border: none;
    transition: filter 0.15s ease, transform 0.08s ease;
    display: inline-flex;
    align-items: center;
    gap: 4px;
}

button:active { transform: translateY(1px); }

button.primary {
    background: var(--success);
    color: #fff;
}
button.primary:hover { filter: brightness(1.08); }

button.ghost {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--accent);
}
button.ghost:hover {
    background: rgba(172,199,255,0.06);
    border-color: var(--accent);
}

button.danger {
    background: var(--danger);
    color: #fff;
}
button.danger:hover { filter: brightness(1.1); }

/* ======= ACTIONS ROW ======= */
.actions-row {
    margin-top: auto;
    padding-top: 12px;
    display: flex;
    gap: 8px;
}
</style>

<body>

<!-- Hamburger Navigation -->
<div class="nav-dropdown" id="navDropdown">
    <button class="nav-toggle" id="navToggle" aria-label="Open navigation menu">
        <div class="hamburger">
            <span></span><span></span><span></span>
        </div>
    </button>
    <div class="nav-menu">
        <a href="https://www.xodiamediagroup.com/" target="_top" rel="noopener">Home</a>
        <a href="https://www.xodiamediagroup.com/upcoming-events" target="_top" rel="noopener">Upcoming Events</a>
        <a href="https://www.xodiamediagroup.com/contact" target="_top" rel="noopener">Contact Us</a>
        <a href="https://tools-dashboard-production-1c7c.up.railway.app/" target="_top" rel="noopener">Tools</a>
    </div>
</div>

<div class="panel">

    <div class="panel-header">
        <div class="panel-titlewrap">
            <h1>Set Time Generator</h1>
            <div class="panel-subtitle">Generates set times for easy editing, copying, and pasting</div>
        </div>
        <img class="panel-logo"
             src="https://images.squarespace-cdn.com/content/v1/681ea18dd168a935c26295bd/c311da3d-6fbf-446a-858c-227fa011e7e3/Xodia+MEDIA+Group+%28TRANS%29+%281%29+%281%29.png?format=750w"
             alt="XODIA Media Group Logo">
    </div>

    <div class="panel-grid">

        <!-- COLUMN 1: Show Information -->
        <div class="col col-1">
            <div class="col-card">
                <h2>Show Information</h2>

                <div class="row">
                    <div style="flex:1;">
                        <label>Number of DJs</label>
                        <input id="djCount" type="number" min="1" value="6">
                    </div>
                    <div style="flex:1;">
                        <label>Presets</label>
                        <select id="presetSelect">
                            <option value="">None</option>
                            <option value="newstandard">New Standard</option>
                            <option value="legacy">Legacy</option>
                            <option value="latestart">Late Start (9PM)</option>
                        </select>
                    </div>
                </div>

                <div class="row">
                    <div style="flex:1;">
                        <label>Show Start Time</label>
                        <input id="startTime" type="time" value="20:00" class="time-small">
                    </div>
                    <div style="flex:1;">
                        <label>Show End Time</label>
                        <input id="endTime" type="time" value="02:00" class="time-small">
                    </div>
                </div>

                <label style="margin-top:14px;">DJ Lineup — edit names &amp; drag to reorder</label>
                <div id="djNamesContainer" class="dj-list"></div>
            </div>
        </div>

        <!-- COLUMN 2: Edit Schedule -->
        <div class="col col-2">
            <div class="col-card">
                <h2>Edit Schedule</h2>
                <div id="results"></div>
            </div>
        </div>

        <!-- COLUMN 3: Preview -->
        <div class="col col-3">
            <div class="col-card">
                <h2>Schedule Preview</h2>
                <div id="previewBox" class="preview-box">Schedule preview will appear here.</div>
                <div class="actions-row">
                    <button id="copyBtnBottom" class="primary">Copy</button>
                    <button id="resetBtn" class="danger">Reset</button>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
/* ======= NAV DROPDOWN ======= */
const navDropdown = document.getElementById('navDropdown');
const navToggle   = document.getElementById('navToggle');

navToggle.addEventListener('click', function(e) {
    e.stopPropagation();
    navDropdown.classList.toggle('active');
});

document.addEventListener('click', function(e) {
    if (!navDropdown.contains(e.target)) navDropdown.classList.remove('active');
});

document.querySelectorAll('.nav-menu a').forEach(link => {
    link.addEventListener('click', () => navDropdown.classList.remove('active'));
});

/* ======= TIME HELPERS ======= */
function hhmmToMin(t){ let[p,q]=t.split(":").map(Number); return p*60+q; }
function minToDisplay(m){
    m=((m%1440)+1440)%1440;
    let h=Math.floor(m/60), mm=m%60;
    h=(h%12)||12;
    return `${h}:${String(mm).padStart(2,'0')}`;
}
function parseDisplay(s){
    let m=s.match(/(\d{1,2}):(\d{2}) ?(AM|PM)?/i);
    if(!m)return null;
    let h=+m[1], mm=+m[2], ap=(m[3]||"AM").toUpperCase();
    if(ap==="AM"&&h===12)h=0;
    if(ap==="PM"&&h!==12)h+=12;
    return h*60+mm;
}

/* ======= PRESETS ======= */
const presets = {
    newstandard: { count:7, start:"20:00", end:"02:00", slotDurations:[45,45,45,45,45,60,75] },
    legacy:      { count:7, start:"20:00", end:"02:00", slotDurations:[45,45,45,45,45,45,90] },
    latestart:   { count:6, start:"21:00", end:"02:00", slotDurations:[45,45,45,45,45,75] }
};

let currentPreset = null;

/* ======= DOM ======= */
const container    = document.getElementById("djNamesContainer");
const djCountEl    = document.getElementById("djCount");
const startEl      = document.getElementById("startTime");
const endEl        = document.getElementById("endTime");
const resultsEl    = document.getElementById("results");
const presetSelect = document.getElementById("presetSelect");
const previewBox   = document.getElementById("previewBox");

let sortable;

/* ======= SCHEDULE TEXT + PREVIEW ======= */
function scheduleToText(rows){
    if(!rows||!rows.length) return "";
    const schedule = rows.map(r=>`${minToDisplay(r.start)}-${minToDisplay(r.end)}: ${r.label}`).join("\n");
    return `SET TIMES:\n${schedule}`;
}

function updatePreview(){
    const rows = resultsEl._rows||[];
    const text  = scheduleToText(rows);
    previewBox.textContent = text || "Schedule preview will appear here.";
}

/* ======= BUILD DJ INPUTS ======= */
function buildDJInputs(){
    let count    = +djCountEl.value;
    let existing = [...container.querySelectorAll("input.name")].map(i=>i.value);

    container.innerHTML = "";

    for(let i=0;i<count;i++){
        let name = existing[i] || `DJ ${i+1}`;
        let row  = document.createElement("div");
        row.className = "dj-item";
        row.innerHTML = `<div class="drag-handle">☰</div><input class="name" type="text" value="${name}">`;
        container.appendChild(row);

        let inp = row.querySelector("input.name");
        inp.onfocus = ()=>inp.select();
        inp.oninput = calculate;
    }

    if(sortable) sortable.destroy();
    sortable = Sortable.create(container,{ handle:".drag-handle", animation:150, onEnd(){ calculate(); } });
}

/* ======= SYNC TIMES ======= */
function syncTimes(idx, type, value){
    let rows = resultsEl._rows;
    if(!rows) return;
    let t = parseDisplay(value);
    if(t==null) return;
    let row = rows[idx];
    if(type==="start"){
        row.start=t; row.dur=row.end-row.start;
        if(idx>0){ rows[idx-1].end=t; rows[idx-1].dur=rows[idx-1].end-rows[idx-1].start; }
    } else if(type==="end"){
        row.end=t; row.dur=row.end-row.start;
        if(idx<rows.length-1){ rows[idx+1].start=t; rows[idx+1].dur=rows[idx+1].end-rows[idx+1].start; }
    }
    renderTimesOnly();
    updatePreview();
}

/* ======= RENDER TIMES ONLY ======= */
function renderTimesOnly(){
    let rows = resultsEl._rows;
    if(!rows) return;
    [...resultsEl.querySelectorAll("input.inline")].forEach(inp=>{
        let idx=+inp.dataset.idx, type=inp.dataset.type, row=rows[idx];
        if(type==="start") inp.value=minToDisplay(row.start);
        else if(type==="end") inp.value=minToDisplay(row.end);
    });
}

/* ======= CALCULATE ======= */
function calculate(){
    let names=[...container.querySelectorAll("input.name")].map(i=>i.value.trim()||"DJ");
    let start=hhmmToMin(startEl.value);
    let end=hhmmToMin(endEl.value);
    if(end<=start) end+=1440;
    let rows=[];

    if(currentPreset&&presets[currentPreset]){
        const p=presets[currentPreset];
        let cur=start;
        p.slotDurations.forEach((dur,i)=>{
            rows.push({ label:names[i]||`DJ ${i+1}`, start:cur, end:cur+dur, dur, isB2B:false });
            cur+=dur;
        });
    } else {
        const total=end-start;
        let count=names.length;
        let per=Math.floor((total/count)/5)*5;
        if(per<5) per=5;
        let used=per*count, leftover=total-used, cur=start;
        names.forEach(name=>{
            rows.push({ label:name, start:cur, end:cur+per, dur:per, isB2B:false });
            cur+=per;
        });
        if(leftover>0) rows.push({ label:"B2B", start:cur, end:cur+leftover, dur:leftover, isB2B:true });
    }

    render(rows);
}

/* ======= RENDER ======= */
function render(rows){
    resultsEl.innerHTML="";
    rows.forEach((r,i)=>{
        let div=document.createElement("div");
        div.className="result-row";

        let nameBlock=document.createElement("div");
        nameBlock.style.fontWeight="600";
        nameBlock.style.fontSize="14px";

        if(r.isB2B){
            let nameInput=document.createElement("input");
            nameInput.className="inline";
            nameInput.dataset.idx=i;
            nameInput.dataset.type="name";
            nameInput.value=r.label;
            nameBlock.appendChild(nameInput);
        } else {
            nameBlock.textContent=r.label;
        }

        let timeRow=document.createElement("div");
        timeRow.style.display="flex";
        timeRow.style.gap="8px";
        timeRow.style.alignItems="center";

        let s=document.createElement("input");
        s.className="inline"; s.dataset.idx=i; s.dataset.type="start";
        s.value=minToDisplay(r.start);

        let e=document.createElement("input");
        e.className="inline"; e.dataset.idx=i; e.dataset.type="end";
        e.value=minToDisplay(r.end);

        s.oninput=()=>syncTimes(i,'start',s.value);
        e.oninput=()=>syncTimes(i,'end',e.value);

        timeRow.appendChild(s);
        timeRow.appendChild(document.createTextNode(" – "));
        timeRow.appendChild(e);

        div.appendChild(nameBlock);
        div.appendChild(timeRow);
        resultsEl.appendChild(div);
    });

    resultsEl._rows=rows;
    updatePreview();
}

/* ======= COPY ======= */
function copySchedule(){
    let rows=resultsEl._rows||[];
    let text=scheduleToText(rows);
    navigator.clipboard.writeText(text);
}

/* ======= RESET ======= */
document.getElementById("resetBtn").onclick=()=>{
    resultsEl.innerHTML="";
    resultsEl._rows=[];
    updatePreview();
};

/* ======= BUTTON WIRING ======= */
document.getElementById("copyBtnBottom").onclick=copySchedule;

/* ======= INPUT WATCHERS ======= */
djCountEl.oninput=()=>{ currentPreset=null; presetSelect.value=""; buildDJInputs(); calculate(); };
startEl.oninput=()=>{ currentPreset=null; presetSelect.value=""; calculate(); };
endEl.oninput=()=>{ currentPreset=null; presetSelect.value=""; calculate(); };

presetSelect.onchange=()=>{
    const key=presetSelect.value;
    currentPreset=key||null;
    const p=presets[key];
    if(p){ djCountEl.value=p.count; startEl.value=p.start; endEl.value=p.end; buildDJInputs(); }
    calculate();
};

/* ======= INIT ======= */
buildDJInputs();
calculate();
</script>
